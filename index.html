<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bingo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🎱 Bingo</h1>

        <p class="subtitulo">
            Sorteie números de 1 a 75
        </p>

        <section class="card">

            <p class="titulo-numero">
                NÚMERO SORTEADO
            </p>

            <div id="numero" class="numero">
                ?
            </div>

            <button id="sortear">
                🎲 Sortear número
            </button>

            <p id="contador" class="contador">
                0 números sorteados
            </p>

        </section>

        <section class="historico">

            <h2>Histórico</h2>

            <div id="lista" class="lista">
                <p class="vazio">
                    Nenhum número sorteado ainda.
                </p>
            </div>

        </section>

    </main>

    <script src="main.js"></script>

</body>
</html>
